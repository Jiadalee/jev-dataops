[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-dataops"
version = "0.1.0"
description = "A streaming data selection, training and evaluation workbench powered by JEV"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Rena Gao"}]
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "build>=1,<2"]
train = ["torch>=2.6,<3", "transformers>=4.46,<5", "peft>=0.14,<1", "safetensors>=0.5,<1", "accelerate>=1,<2"]
export = ["pyarrow>=18,<24"]

[project.scripts]
jev-dataops = "jev_dataops.cli:main"

[project.urls]
Repository = "https://github.com/RenaGao/jev-dataops"

[tool.setuptools.packages.find]
include = ["jev_dataops*"]

[tool.setuptools.package-data]
jev_dataops = ["static/*", "rubrics/*.json", "examples/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
